name: MCP CI

on:
  push:
    branches: [main]
    paths:
      - 'mcp/**'
      - '.github/workflows/mcp-ci.yml'
      - '.github/workflows/mcp-publish.yml'
  pull_request:
    branches: [main]
    paths:
      - 'mcp/**'
      - '.github/workflows/mcp-ci.yml'
      - '.github/workflows/mcp-publish.yml'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest tests/ -v --tb=short

  package:
    name: Installed wheel security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel from sdist
        run: |
          python -m pip install build
          python -m build --outdir "$RUNNER_TEMP/mcp-dist" ./mcp
      - name: Install wheel into a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/mcp-wheel-venv"
          "$RUNNER_TEMP/mcp-wheel-venv/bin/python" -m pip install "$RUNNER_TEMP"/mcp-dist/tickdb_mcp-*.whl
          "$RUNNER_TEMP/mcp-wheel-venv/bin/python" -m pip check
      - name: Verify installed entrypoint outside the checkout
        run: |
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/mcp-wheel-venv/bin/python" "$GITHUB_WORKSPACE/mcp/scripts/verify_installed_package.py" --output "$RUNNER_TEMP/mcp-package-verification.json"

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t tickdb-mcp:ci ./mcp
