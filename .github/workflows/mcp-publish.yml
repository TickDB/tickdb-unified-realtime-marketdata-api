name: Publish MCP to PyPI

on:
  release:
    types: [published]

permissions: {}

concurrency:
  group: mcp-publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Validate and build MCP distributions
    if: >-
      github.repository == 'TickDB/tickdb-unified-realtime-marketdata-api' &&
      startsWith(github.event.release.tag_name, 'mcp/v') &&
      !github.event.release.draft && !github.event.release.prerelease
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out the release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Validate release tag, fixed commit, and package version
        id: release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import ast
          import os
          import re
          import subprocess
          import tomllib
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          sha = os.environ["RELEASE_SHA"]
          assert re.fullmatch(r"mcp/v[0-9]+\.[0-9]+\.[0-9]+", tag), tag
          assert os.environ["GITHUB_REF"] == f"refs/tags/{tag}"
          for revision in ("HEAD", f"refs/tags/{tag}^{{commit}}"):
              actual = subprocess.check_output(
                  ["git", "rev-parse", "--verify", revision], text=True,
              ).strip()
              assert actual == sha, f"Release tag/checkout changed: {revision} = {actual}"
          project = tomllib.loads(Path("mcp/pyproject.toml").read_text())["project"]
          assert project["name"] == "tickdb-mcp"
          version = project["version"]
          assert tag == f"mcp/v{version}", "Tag and package versions differ"
          module = ast.parse(Path("mcp/tickdb_mcp/__init__.py").read_text())
          versions = [
              ast.literal_eval(node.value) for node in module.body
              if isinstance(node, ast.Assign)
              and any(isinstance(target, ast.Name) and target.id == "__version__"
                      for target in node.targets)
          ]
          assert versions == [version], "Runtime and package versions differ"
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"version={version}\n")
          print(f"Validated {tag} at fixed commit {sha}")
          PY
      - name: Install validation tools and development dependencies
        run: python -m pip install build twine "./mcp[dev]"
      - name: Lint and test
        run: |
          python -m ruff check mcp
          python -m pytest mcp/tests -q
      - name: Check that the version has no files on PyPI
        env:
          EXPECTED_VERSION: ${{ steps.release.outputs.version }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          version = os.environ["EXPECTED_VERSION"]
          request = urllib.request.Request(
              f"https://pypi.org/pypi/tickdb-mcp/{version}/json",
              headers={"User-Agent": "tickdb-mcp-release-preflight"},
          )
          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  existing = json.load(response)
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
          else:
              assert not existing.get("urls"), "PyPI already has files for this version"
          PY
      - name: Build sdist and wheel from sdist
        run: python -m build --outdir "$RUNNER_TEMP/mcp-dist" ./mcp
      - name: Check distribution metadata and README rendering
        env:
          EXPECTED_VERSION: ${{ steps.release.outputs.version }}
        run: |
          python -m twine check --strict "$RUNNER_TEMP"/mcp-dist/*
          python - <<'PY'
          import email.parser
          import os
          import tarfile
          import zipfile
          from pathlib import Path

          directory = Path(os.environ["RUNNER_TEMP"]) / "mcp-dist"
          wheels = list(directory.glob("*.whl"))
          sources = list(directory.glob("*.tar.gz"))
          assert len(wheels) == len(sources) == 1, "Expected one wheel and one sdist"
          with zipfile.ZipFile(wheels[0]) as archive:
              name = next(n for n in archive.namelist() if n.endswith(".dist-info/METADATA"))
              metadata = [archive.read(name)]
          with tarfile.open(sources[0]) as archive:
              name = next(n for n in archive.getnames()
                          if n.count("/") == 1 and n.endswith("/PKG-INFO"))
              metadata.append(archive.extractfile(name).read())
          for content in metadata:
              package = email.parser.BytesParser().parsebytes(content)
              assert package["Name"] == "tickdb-mcp"
              assert package["Version"] == os.environ["EXPECTED_VERSION"]
              assert package["Description-Content-Type"].startswith("text/markdown")
              assert package.get_payload().strip(), "PyPI README is empty"
              assert package["License-Expression"] or package["License"]
              assert len(package.get_all("Project-URL", [])) >= 4
          PY
      - name: Install the built wheel in a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/mcp-install"
          "$RUNNER_TEMP/mcp-install/bin/python" -m pip install "$RUNNER_TEMP"/mcp-dist/*.whl
          "$RUNNER_TEMP/mcp-install/bin/python" -m pip check
      - name: Verify the installed version and secure startup outside the checkout
        env:
          EXPECTED_VERSION: ${{ steps.release.outputs.version }}
        run: |
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/mcp-install/bin/python" - <<'PY'
          import os
          from importlib.metadata import version
          from tickdb_mcp import __version__

          assert version("tickdb-mcp") == __version__ == os.environ["EXPECTED_VERSION"]
          PY
          "$RUNNER_TEMP/mcp-install/bin/python" "$GITHUB_WORKSPACE/mcp/scripts/verify_installed_package.py" --output "$RUNNER_TEMP/mcp-install-verification.json"
      - name: Save only the validated distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mcp-distributions-${{ github.sha }}
          path: |
            ${{ runner.temp }}/mcp-dist/*.whl
            ${{ runner.temp }}/mcp-dist/*.tar.gz
          if-no-files-found: error
          overwrite: true

  publish:
    name: Publish tickdb-mcp ${{ needs.build.outputs.version }} to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/tickdb-mcp
    permissions:
      id-token: write
    steps:
      - name: Download the distributions validated by this workflow run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mcp-distributions-${{ github.sha }}
          path: dist
      - name: Publish validated distributions using PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/
          print-hash: true
